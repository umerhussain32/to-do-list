name: Build APK and AAB
on:
  workflow_dispatch:
    inputs:
      format:
        description: 'What to build'
        required: true
        default: 'both'
        type: choice
        options: [apk, aab, both]
      signing:
        description: 'Signing mode'
        required: true
        default: 'auto'
        type: choice
        options: [auto, custom]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Scaffold Android platform around generated code
        run: |
          cp -r lib /tmp/gen_lib
          cp pubspec.yaml /tmp/gen_pubspec.yaml
          NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          flutter create --platforms=android --project-name "$NAME" --org com.example .
          rm -rf lib && cp -r /tmp/gen_lib lib
          cp /tmp/gen_pubspec.yaml pubspec.yaml
          # Pure-Dart apps need no NDK; dropping it avoids a 1 GB+ install.
          sed -i '/ndkVersion/d' android/app/build.gradle.kts 2>/dev/null || sed -i '/ndkVersion/d' android/app/build.gradle 2>/dev/null || true
          flutter pub get
      - name: Prepare signing
        env:
          SIGNING: ${{ inputs.signing }}
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cd android
          if [ "$SIGNING" = "custom" ] && [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > app/release.jks
            cat > key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF
          else
            # Auto-sign: one keystore per repo, kept as a build artifact so
            # the owner can back it up. Reuse via KEYSTORE_BASE64 secret if set.
            if [ -n "$KS_B64" ]; then
              echo "$KS_B64" | base64 -d > app/release.jks
              ALIAS=upload; KPASS=androidbuilder; SPASS=androidbuilder
              if [ -n "$KEY_ALIAS" ]; then ALIAS=$KEY_ALIAS; fi
              if [ -n "$KEY_PASSWORD" ]; then KPASS=$KEY_PASSWORD; fi
              if [ -n "$STORE_PASSWORD" ]; then SPASS=$STORE_PASSWORD; fi
            else
              keytool -genkeypair -v -keystore app/release.jks -alias upload \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass androidbuilder -keypass androidbuilder \
                -dname "CN=AI App Builder, OU=Apps, O=Generated, L=Unknown, S=Unknown, C=US"
              ALIAS=upload; KPASS=androidbuilder; SPASS=androidbuilder
            fi
            cat > key.properties <<EOF
          storePassword=$SPASS
          keyPassword=$KPASS
          keyAlias=$ALIAS
          storeFile=release.jks
          EOF
          fi
          cat > /tmp/signing_block.txt <<'EOF'
              val keystoreProperties = java.util.Properties()
              val keystorePropertiesFile = rootProject.file("key.properties")
              if (keystorePropertiesFile.exists()) { keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile)) }
              signingConfigs { create("release") { keyAlias = keystoreProperties["keyAlias"] as String?; keyPassword = keystoreProperties["keyPassword"] as String?; storeFile = keystoreProperties["storeFile"]?.let { file(it) }; storePassword = keystoreProperties["storePassword"] as String? } }
          EOF
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('app/build.gradle.kts')
          if not p.exists():
              p = pathlib.Path('app/build.gradle')
          s = p.read_text()
          if 'key.properties' not in s and p.suffix == '.kts':
              block = pathlib.Path('/tmp/signing_block.txt').read_text()
              s = s.replace('android {', 'android {\n' + block, 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              p.write_text(s)
          print('signing wired into', p)
          PY
      - name: Analyze (Flutter MCP-equivalent checks)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build APK
        if: inputs.format == 'apk' || inputs.format == 'both'
        run: flutter build apk --release
      - name: Build AAB
        if: inputs.format == 'aab' || inputs.format == 'both'
        run: flutter build appbundle --release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            android/app/release.jks
          if-no-files-found: warn
      - name: Attach to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
